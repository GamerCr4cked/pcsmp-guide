<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title><meta name="description" content="{{ page.description | default: site.description }}"><meta name="theme-color" content="#080f1d"><link rel="canonical" href="{{ page.url | absolute_url }}"><meta property="og:title" content="{{ page.title | default: site.title }}"><meta property="og:description" content="{{ site.description }}"><link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></head><body><div class="scrim" id="scrim"></div>{% include sidebar.html %}<div class="shell"><header class="topbar"><button id="menu" aria-label="Open menu">☰</button><div><a href="{{ '/' | relative_url }}">Guide</a>{% unless page.url == '/' %}<span> / </span><b>{{ page.title }}</b>{% endunless %}</div><a class="project-link" href="https://github.com/GamerCr4cked/PowerCoreSMP" target="_blank" rel="noopener">Server project ↗</a></header><main class="{% if page.url == '/' %}home{% else %}doc{% endif %}">{% unless page.url == '/' %}<header class="doc-head"><small>POWERCORESMP / DOCUMENTATION</small><h1>{{ page.title }}</h1></header>{% endunless %}<article class="prose">{{ content }}</article><footer>POWERCORESMP · PLAYER GUIDE <span>Built by <a href="https://github.com/GamerCr4cked">GC</a></span></footer></main></div><script>(()=>{let s=document.getElementById('sidebar'),o=document.getElementById('scrim');document.getElementById('menu').onclick=()=>{s.classList.add('open');o.classList.add('on')};o.onclick=()=>{s.classList.remove('open');o.classList.remove('on')};let q=document.getElementById('navSearch');q.oninput=()=>{let v=q.value.toLowerCase();s.querySelectorAll('nav a').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(v))};document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();q.focus()}if(e.key==='Escape')q.blur()});})();</script></body></html>
