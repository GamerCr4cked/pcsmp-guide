<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="site-wrapper">
    {% include sidebar.html %}

    <div class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h1>⚡ {{ site.title }}</h1>
      </div>

      <div class="content">
        {{ content }}
      </div>

      <div class="site-footer">
        <em>PowerCoreSMP — Choose your core. Master your abilities. Survive.</em>
      </div>
    </div>
  </div>

  <script>
    // Mobile sidebar toggle
    const toggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    if (toggle) {
      toggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
      });
    }
    if (overlay) {
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      });
    }

    // Close sidebar on link click (mobile)
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });
    });

    // Wrap core sections with colored accent divs
    const coreIds = [
      'fire-core', 'ice-core', 'void-core', 'nature-core', 'storm-core',
      'lunar-core', 'blood-core', 'crystal-core', 'ocean-core', 'undead-core',
      'dragon-core', 'soul-core', 'ancient-core'
    ];
    coreIds.forEach(id => {
      const anchor = document.getElementById(id);
      if (!anchor) return;
      const coreName = id.replace('-core', '');
      const wrapper = document.createElement('div');
      wrapper.className = 'core-section core-' + coreName;
      // Collect all elements between this anchor and the next <hr>
      let el = anchor.nextElementSibling;
      const els = [];
      while (el && el.tagName !== 'HR') {
        els.push(el);
        el = el.nextElementSibling;
      }
      // Insert wrapper before the first element
      if (els.length > 0) {
        els[0].parentNode.insertBefore(wrapper, anchor);
        wrapper.appendChild(anchor);
        els.forEach(e => wrapper.appendChild(e));
      }
    });

    // Highlight active sidebar link on scroll
    const sections = document.querySelectorAll('a[id]');
    const navLinks = document.querySelectorAll('.sidebar nav a');

    function highlightNav() {
      let current = '';
      sections.forEach(section => {
        const rect = section.getBoundingClientRect();
        if (rect.top <= 120) {
          current = section.id;
        }
      });
      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href').endsWith('#' + current)) {
          link.classList.add('active');
        }
      });
    }
    window.addEventListener('scroll', highlightNav);
  </script>
</body>
</html>
